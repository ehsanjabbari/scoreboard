<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- جلوگیری از زوم شدن ناخواسته در گوشی -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="icon" type="image/png" href="logo.png">
    
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="جدول بازی">
    
    <title>جدول امتیازات بازی</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 95vh;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }
        
        .header-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .header-section h1 {
            margin: 0;
            color: #2c3e50;
            font-size: 1.6em;
        }
        .app-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px dashed #eee;
            justify-content: space-between;
        }
        
        .guest-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
            width: 130px;
            -webkit-user-select: text; 
            user-select: text;
        }
        button {
            padding: 10px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: background 0.3s;
            font-size: 13px;
        }
        .btn-select-players { background-color: #f39c12; color: white; font-size: 14px; }
        .btn-select-players:hover { background-color: #d68910; }
        .btn-add-player { background-color: #27ae60; color: white; }
        .btn-add-player:hover { background-color: #219150; }
        .btn-add-round { background-color: #8e44ad; color: white; }
        .btn-add-round:hover { background-color: #732d91; }
        
        .btn-reset { background-color: #e74c3c; color: white; margin-right: auto;}
        .btn-reset:hover { background-color: #c0392b; }
        
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch; 
        }
        table {
            width: 100%;
            border-collapse: separate; 
            border-spacing: 0;
            margin-top: 10px;
        }
        
        /* کاهش عرض ستون‌ها و کمتر کردن فاصله‌های داخلی */
        th, td {
            border: 1px solid #ddd;
            padding: 6px 4px;
            text-align: center;
            min-width: 65px; /* کمتر کردن حداقل عرض */
            box-sizing: border-box; /* برای محاسبه دقیق عرض‌ها در حالت فریز */
        }
        th {
            background-color: #ecf0f1;
            font-weight: bold;
            font-size: 0.95em;
        }

        /* ------------------------------------------- */
        /* فریز کردن ستون اول (نام بازیکن) */
        th:nth-child(1), td:nth-child(1) {
            position: sticky;
            right: 0; 
            background-color: white; 
            z-index: 10;
            width: 95px;       /* عرض ثابت برای ستون اول */
            min-width: 95px;
            max-width: 95px;
            word-break: break-word; /* شکستن نام‌های طولانی */
            font-size: 0.9em;
        }
        th:nth-child(1) {
            background-color: #ecf0f1; 
            z-index: 11; 
        }

        /* فریز کردن ستون دوم (جمع کل) */
        th:nth-child(2), td:nth-child(2) {
            position: sticky;
            right: 95px; /* شروع از انتهای ستون اول */
            z-index: 10;
            width: 70px;       /* عرض ثابت برای ستون دوم */
            min-width: 70px;
            max-width: 70px;
            box-shadow: -4px 0 6px -3px rgba(0,0,0,0.15); /* انتقال سایه به ستون دوم */
        }
        th:nth-child(2) {
            background-color: #ecf0f1; 
            z-index: 11; 
        }
        td:nth-child(2) {
            background-color: #fff3cd; /* رنگ پس‌زمینه ستون جمع */
        }
        /* ------------------------------------------- */

        #columnTotalsRow td {
            background-color: #d1ecf1;
            font-weight: bold;
            color: #0c5460;
            font-size: 0.9em;
        }
        /* استایل حالت فریز برای ردیف جمع ستون‌ها */
        #columnTotalsRow td:nth-child(1) {
            background-color: #b8daff; 
            z-index: 11; 
        }
        #columnTotalsRow td:nth-child(2) {
            background-color: #fde3a7;
            z-index: 11; 
        }

        /* کوچک‌تر کردن کادرهای ورود اعداد */
        input[type="number"] {
            width: 50px; /* کاهش عرض فیلد عدد */
            padding: 8px 2px;
            text-align: center;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1em;
            -webkit-user-select: text; 
            user-select: text;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        .total-col {
            font-size: 1.1em;
            font-weight: bold;
            color: #d35400;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-header {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2980b9;
            text-align: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .checkbox-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 5px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #f8f9f9;
            border: 1px solid #e5e8e8;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .checkbox-item:hover {
            background: #e8f6f3;
            border-color: #1abc9c;
        }
        .checkbox-item input {
            margin-left: 15px;
            transform: scale(1.3);
            cursor: pointer;
        }
        .modal-footer {
            display: flex;
            justify-content: space-between;
        }
        .btn-confirm { background-color: #3498db; color: white; width: 100%; font-size: 1.1em; padding: 12px;}
        .btn-confirm:hover { background-color: #2980b9; }
        .btn-cancel { background-color: #95a5a6; color: white; margin-left: 10px;}
        .btn-cancel:hover { background-color: #7f8c8d; }

        .credit {
            text-align: center;
            font-size: 10px;
            color: #999;
            margin-top: 25px;
            direction: ltr;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <img src="logo.png" alt="لوگوی بازی" class="app-logo" onerror="this.style.display='none'">
        <h1>📝 جدول نتایج بازی</h1>
    </div>
    
    <div class="controls">
        <button class="btn-select-players" onclick="openModal()">👥 انتخاب بازیکن‌ها</button>
        
        <div class="guest-group">
            <input type="text" id="guestName" placeholder="نام مهمان...">
            <button class="btn-add-player" onclick="addGuestPlayer()">+ مهمان</button>
        </div>
        
        <button class="btn-add-round" onclick="addRound()">+ افزودن دور جدید</button>
        <button class="btn-reset" onclick="resetGame()">🔄 بازی جدید</button>
    </div>

    <div class="table-wrapper">
        <table id="scoreTable">
            <thead>
                <tr id="headerRow">
                    <th>نام بازیکن</th>
                    <th class="total-col">جمع کل</th>
                </tr>
                <!-- ردیف جمع ستون‌ها (کمی نامش را خلاصه کردیم تا جا بشود) -->
                <tr id="columnTotalsRow">
                    <td>📊 جمع</td>
                    <td id="grandTotalCell" class="total-col">0</td>
                </tr>
            </thead>
            <tbody id="playerRows">
            </tbody>
        </table>
    </div>
</div>

<div class="credit">Created by EhsanJabbari</div>

<div class="modal-overlay" id="playersModal">
    <div class="modal-box">
        <div class="modal-header">افراد حاضر در بازی را انتخاب کنید</div>
        <div class="checkbox-list" id="modalCheckboxList"></div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">انصراف</button>
            <button class="btn-confirm" onclick="confirmPlayers()">✔️ تایید و ورود</button>
        </div>
    </div>
</div>

<script>
    let roundCount = 0;
    
    const defaultPlayersList = [
        'مهرداد', 'رامین', 'حسین راموس', 'حسین راد', 'احسان', 
        'اشکان', 'ایمان', 'محسن', 'مهدی', 'امیر حسین',
        'مصطفی', 'داوود', 'وحید'
    ];

    function getSafeId(name) {
        return 'cb-' + name.replace(/\s+/g, '-');
    }

    function renderCheckboxes() {
        const listContainer = document.getElementById('modalCheckboxList');
        let htmlContent = '';
        defaultPlayersList.forEach(name => {
            htmlContent += `
                <label class="checkbox-item">
                    <input type="checkbox" id="${getSafeId(name)}" value="${name}">
                    <span>${name}</span>
                </label>
            `;
        });
        listContainer.innerHTML = htmlContent;
    }

    function saveData() {
        const rows = document.querySelectorAll('#playerRows tr');
        const playersData = [];
        
        rows.forEach(row => {
            const name = row.cells[0].textContent;
            const inputs = row.querySelectorAll('input[type="number"]');
            const scores = Array.from(inputs).map(input => input.value);
            playersData.push({ name, scores });
        });

        const gameData = {
            roundCount: roundCount,
            players: playersData
        };
        localStorage.setItem('gameData', JSON.stringify(gameData));
    }

    function loadData() {
        const saved = localStorage.getItem('gameData');
        if (saved) {
            const gameData = JSON.parse(saved);
            roundCount = gameData.roundCount;

            const headerRow = document.getElementById('headerRow');
            const columnTotalsRow = document.getElementById('columnTotalsRow');
            
            for (let i = 1; i <= roundCount; i++) {
                const th = document.createElement('th');
                th.textContent = 'دور ' + i;
                headerRow.appendChild(th);

                const colTotalCell = document.createElement('td');
                colTotalCell.textContent = '0';
                columnTotalsRow.appendChild(colTotalCell);
            }

            const tbody = document.getElementById('playerRows');
            gameData.players.forEach(player => {
                const safeRowId = 'row-' + player.name.replace(/\s+/g, '-');
                const tr = document.createElement('tr');
                tr.id = safeRowId; 

                const nameTd = document.createElement('td');
                nameTd.textContent = player.name;
                tr.appendChild(nameTd);

                const totalTd = document.createElement('td');
                totalTd.className = 'total-col';
                totalTd.textContent = '0';
                tr.appendChild(totalTd);

                player.scores.forEach(scoreVal => {
                    const td = document.createElement('td');
                    td.innerHTML = `<input type="number" oninput="calculateTotal(this)" value="${scoreVal}" placeholder="0">`;
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);

                const checkbox = document.getElementById(getSafeId(player.name));
                if (checkbox) checkbox.checked = true;
            });

            const rows = document.querySelectorAll('#playerRows tr');
            rows.forEach(row => {
                const inputs = row.querySelectorAll('input[type="number"]');
                let sum = 0;
                inputs.forEach(input => { sum += Number(input.value) || 0; });
                row.querySelector('.total-col').textContent = sum;
            });
            
            calculateColumnTotals();
        }
    }

    function resetGame() {
        if(confirm("آیا مطمئن هستید که می‌خواهید بازی را ریست کنید؟ تمام نتایج صفر خواهند شد.")) {
            localStorage.removeItem('gameData');
            location.reload(); 
        }
    }

    function calculateColumnTotals() {
        const playerRows = document.querySelectorAll('#playerRows tr');
        const colTotalsRow = document.getElementById('columnTotalsRow');
        let grandTotal = 0;

        playerRows.forEach(row => {
            const rowTotal = Number(row.querySelector('.total-col').textContent) || 0;
            grandTotal += rowTotal;
        });
        document.getElementById('grandTotalCell').textContent = grandTotal;

        for (let c = 0; c < roundCount; c++) {
            let colSum = 0;
            playerRows.forEach(row => {
                const inputs = row.querySelectorAll('input[type="number"]');
                if (inputs[c]) {
                    colSum += Number(inputs[c].value) || 0;
                }
            });
            if (colTotalsRow.cells[c + 2]) {
                colTotalsRow.cells[c + 2].textContent = colSum;
            }
        }
    }

    function openModal() { document.getElementById('playersModal').classList.add('active'); }
    function closeModal() { document.getElementById('playersModal').classList.remove('active'); }

    function confirmPlayers() {
        defaultPlayersList.forEach(name => {
            const checkbox = document.getElementById(getSafeId(name));
            if (checkbox && checkbox.checked) {
                addPlayerToTable(name);
            } else {
                removePlayerFromTable(name);
            }
        });
        closeModal(); 
        calculateColumnTotals();
        saveData(); 
    }

    function addGuestPlayer() {
        const nameInput = document.getElementById('guestName');
        const name = nameInput.value.trim();
        if (!name) { alert('لطفاً نام مهمان را وارد کنید!'); return; }
        addPlayerToTable(name);
        const checkbox = document.getElementById(getSafeId(name));
        if(checkbox) checkbox.checked = true;
        nameInput.value = ''; 
        nameInput.focus();
        calculateColumnTotals();
        saveData(); 
    }

    function addPlayerToTable(name) {
        const safeRowId = 'row-' + name.replace(/\s+/g, '-');
        if (document.getElementById(safeRowId)) return;

        const tbody = document.getElementById('playerRows');
        const tr = document.createElement('tr');
        tr.id = safeRowId; 

        const nameTd = document.createElement('td');
        nameTd.textContent = name;
        tr.appendChild(nameTd);

        const totalTd = document.createElement('td');
        totalTd.className = 'total-col';
        totalTd.textContent = '0';
        tr.appendChild(totalTd);

        for (let i = 0; i < roundCount; i++) {
            const td = document.createElement('td');
            td.innerHTML = `<input type="number" oninput="calculateTotal(this)" placeholder="0">`;
            tr.appendChild(td);
        }
        tbody.appendChild(tr);
    }

    function removePlayerFromTable(name) {
        const safeRowId = 'row-' + name.replace(/\s+/g, '-');
        const row = document.getElementById(safeRowId);
        if (row) {
            row.remove();
            calculateColumnTotals();
            saveData();
        }
    }

    function addRound() {
        roundCount++;
        
        const headerRow = document.getElementById('headerRow');
        const th = document.createElement('th');
        th.textContent = 'دور ' + roundCount;
        headerRow.appendChild(th);

        const columnTotalsRow = document.getElementById('columnTotalsRow');
        const colTotalCell = document.createElement('td');
        colTotalCell.textContent = '0';
        columnTotalsRow.appendChild(colTotalCell);

        const tbody = document.getElementById('playerRows');
        const rows = tbody.getElementsByTagName('tr');
        
        for (let row of rows) {
            const td = document.createElement('td');
            td.innerHTML = `<input type="number" oninput="calculateTotal(this)" placeholder="0">`;
            row.appendChild(td);
        }
        saveData(); 
    }

    function calculateTotal(inputElement) {
        const row = inputElement.closest('tr');
        const inputs = row.querySelectorAll('input[type="number"]');
        let sum = 0;
        
        inputs.forEach(input => {
            sum += Number(input.value) || 0; 
        });
        
        const totalCell = row.querySelector('.total-col');
        totalCell.textContent = sum; 
        
        calculateColumnTotals();
        saveData();
    }

    renderCheckboxes();
    loadData();

</script>

</body>
</html>
